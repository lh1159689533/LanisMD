name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rustTargets: 'aarch64-apple-darwin'
          # x86_64 在 Intel runner 上原生构建，避免 arm64 交叉编译
          # macos-15-intel 是 GitHub 在 macos-13 下线后保留的 Intel 架构标准 runner
          - platform: 'macos-15-intel'
            args: '--target x86_64-apple-darwin'
            rustTargets: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
            rustTargets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与本地及 pnpm-lock.yaml 的 lockfileVersion 6.0 保持一致，
          # 避免 CI 里 frozen-lockfile 因锁文件版本升级而失败
          version: 8.11.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      # v1 才完整支持 Tauri 2 的 updater：自动生成并合并多平台 latest.json
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名私钥（内容，不是路径），需在仓库 Secrets 中配置。
          # 当前密钥无密码，密码 Secret 未配置时会渲染为空字符串，等价于空密码。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 提高 Node 堆上限，避免 vite build 在内存受限的 CI runner 上 OOM
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: 'LanisMD v__VERSION__'
          # 发布说明会同步写入 latest.json 的 notes，并在应用内更新通知中展示；
          # 留空则不展示，需要时可在此填写面向用户的更新内容
          releaseBody: ''
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
